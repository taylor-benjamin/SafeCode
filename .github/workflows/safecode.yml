# SAFECODE scanning its own repository (dogfooding), exactly as a user would set it up.
name: SAFECODE

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # to post the report comment on PRs

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so Gitleaks can find secrets in old commits
          persist-credentials: false
      - uses: ./
        with:
          fail-threshold: B
          # The demo app and the test fixtures are intentionally insecure.
          exclude-paths: examples/, tests/
